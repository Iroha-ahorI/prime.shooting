<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>　割り算インベーダー </title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

  <style>
    body, html {
      margin: 0;
      padding: 0;
      overflow: hidden;
      background: black;
      user-select: none;
      -webkit-touch-callout: none;
    }

    /* 中央80%のゲーム画面 */
    #gameCanvas {
      position: fixed;
      left: 10vw;
      width: 80vw;
      height: 100vh;
      background: black;
      display: block;
    }

    /* 左側UI（10%） */
    #leftUI {
      position: fixed;
      left: 0;
      top: 0;
      width: 10vw;
      height: 100vh;
      background: rgba(0,0,0,0.4);
      color: white;
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 20px;
      z-index: 20;
    }

    /* 右側UI（10%） */
    #rightUI {
      position: fixed;
      right: 0;
      top: 0;
      width: 10vw;
      height: 100vh;
      background: rgba(0,0,0,0.4);
      color: cyan;
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 20px;
      z-index: 20;
    }

    /* ボタン共通 */
    #leftUI button, #rightUI button {
      font-size: 28px;
      padding: 20px;
      background: rgba(255,255,255,0.2);
      color: white;
      border: 2px solid white;
      border-radius: 10px;
      cursor: pointer;
      touch-action: manipulation;
    }

    /* ボタンを画面下に寄せる */
    .bottomButtons {
      margin-top: auto;
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    #restartBtn {
      display: none;
      position: absolute;
      top: 40%;
      left: 50%;
      transform: translate(-50%, -50%);
      padding: 20px 40px;
      font-size: 26px;
      background: #f44336;
      color: white;
      border: none;
      border-radius: 10px;
      cursor: pointer;
      z-index: 30;
    }
  </style>
</head>

<body>

<!-- 左側UI -->
<div id="leftUI">
  <div id="rankingDisplay"></div>

  <div class="bottomButtons">
    <button id="skipBtn">変更</button>
    <button id="leftBtn">←</button>
  </div>
</div>

<!-- 中央ゲーム画面 -->
<canvas id="gameCanvas"></canvas>
<button id="restartBtn">Restart</button>

<!-- 右側UI -->
<div id="rightUI">
  <div id="bulletQueueDisplay"></div>

  <div class="bottomButtons">
    <button id="upBtn">攻撃</button>
    <button id="rightBtn">→</button>
  </div>
</div>

<script>
const canvas = document.getElementById("gameCanvas");
const ctx = canvas.getContext("2d");
const restartBtn = document.getElementById("restartBtn");

function resizeCanvas(){
  canvas.width = window.innerWidth * 0.80;
  canvas.height = window.innerHeight;
}
window.addEventListener("resize", resizeCanvas);
resizeCanvas();

const WIDTH = ()=>canvas.width;
const HEIGHT = ()=>canvas.height;

let playerX, playerY, bullets, enemies, bulletQueue, enemyTimer, score, lives;
let gameOver;
let effects = [];

const bulletNumbers = [2,3,3,4,5,6,7];

function initGame(){
  playerX = WIDTH()/2;
  playerY = HEIGHT() - 50;
  bullets = [];
  enemies = [];
  bulletQueue = Array.from({length:7},()=>bulletNumbers[Math.floor(Math.random()*bulletNumbers.length)]);
  enemyTimer = 0;
  score = 0;
  lives = 2;
  gameOver = false;
  effects = [];
  restartBtn.style.display = "none";
  drawBulletQueue();
}

class Bullet {
  constructor(x,y,value){ this.x=x; this.y=y; this.value=value; this.speed=-10; }
  update(){ this.y += this.speed; }
  draw(){ ctx.fillStyle="yellow"; ctx.fillText(this.value,this.x,this.y); }
}

class Enemy {
  constructor(x,y,value){ this.x=x; this.y=y; this.value=value; this.speed=1; }
  update(){ this.y += this.speed; }
  draw(){
  ctx.font = "60px Arial";
  ctx.fillStyle = "white";
  ctx.fillText("👻", this.x - 20, this.y - 30);

  ctx.font = "40px Arial";
  ctx.fillStyle = "red";
  ctx.fillText(this.value, this.x + 0, this.y + 10);
}
  hit(bulletValue){
    if(this.value % bulletValue === 0){
      this.value = Math.floor(this.value / bulletValue);
      if(this.value === 1) return true;
    }
    return false;
  }
}

function generateComposite(){
  let factors = [];
  let count = Math.floor(Math.random()*2)+2;
  while(factors.length < count){
    let f = bulletNumbers[Math.floor(Math.random()*bulletNumbers.length)];
    if(!factors.includes(f)) factors.push(f);
  }
  return factors.reduce((a,b)=>a*b,1);
}

let keys = {};

document.addEventListener("keydown", e=>{
  if(["ArrowLeft","ArrowRight"].includes(e.key)) e.preventDefault();
  keys[e.key] = true;
  if(e.key === "ArrowUp") shootBullet();
  if(e.key === "ArrowDown") skipBullet();
});
document.addEventListener("keyup", e=> keys[e.key] = false);

/* 長押し時のブラウザ機能を無効化 */
function preventTouch(e){ e.preventDefault(); }

/* 左ボタン */
document.getElementById("leftBtn").addEventListener("touchstart", e=>{
  preventTouch(e);
  keys["ArrowLeft"] = true;
});
document.getElementById("leftBtn").addEventListener("touchend", e=>{
  preventTouch(e);
  keys["ArrowLeft"] = false;
});
document.getElementById("leftBtn").addEventListener("click", ()=>{
  keys["ArrowLeft"] = true;
  setTimeout(()=> keys["ArrowLeft"]=false, 100);
});

/* 右ボタン */
document.getElementById("rightBtn").addEventListener("touchstart", e=>{
  preventTouch(e);
  keys["ArrowRight"] = true;
});
document.getElementById("rightBtn").addEventListener("touchend", e=>{
  preventTouch(e);
  keys["ArrowRight"] = false;
});
document.getElementById("rightBtn").addEventListener("click", ()=>{
  keys["ArrowRight"] = true;
  setTimeout(()=> keys["ArrowRight"]=false, 100);
});

/* Shoot */
document.getElementById("upBtn").addEventListener("touchstart", e=>{
  preventTouch(e);
  shootBullet();
});
document.getElementById("upBtn").addEventListener("click", ()=> shootBullet());

/* Skip */
document.getElementById("skipBtn").addEventListener("touchstart", e=>{
  preventTouch(e);
  skipBullet();
});
document.getElementById("skipBtn").addEventListener("click", ()=> skipBullet());

function shootBullet(){
  bullets.push(new Bullet(playerX, playerY, bulletQueue[bulletQueue.length-1]));
  bulletQueue.pop();
  bulletQueue.unshift(bulletNumbers[Math.floor(Math.random()*bulletNumbers.length)]);
  drawBulletQueue();
}

function skipBullet(){
  bulletQueue.pop();
  bulletQueue.unshift(bulletNumbers[Math.floor(Math.random()*bulletNumbers.length)]);
  drawBulletQueue();
}

function drawBulletQueue(){
  const queueDiv = document.getElementById("bulletQueueDisplay");

  let html = "";
  const q = bulletQueue.slice(0, bulletQueue.length - 1).reverse();

  q.forEach((value, index) => {
    // 発射に近いほど index が小さい
    const size = 20 + (q.length - index) * 6;  
    const margin = 4;
    html += `<div style="font-size:${size}px; margin-bottom:2px;">${value}</div>`;
  });

  queueDiv.innerHTML = html;
}

function saveScore(score){
  let scores = JSON.parse(localStorage.getItem("scores") || "[]");
  scores.push(score);
  scores.sort((a,b)=>b-a);
  scores = scores.slice(0, 5);
  localStorage.setItem("scores", JSON.stringify(scores));
}

function drawRanking(){
  let scores = JSON.parse(localStorage.getItem("scores") || "[]");
  let html = "<b>Top Scores</b><br>";
  scores.forEach((s,i)=> html += `${i+1}. ${s}<br>`);
  document.getElementById("rankingDisplay").innerHTML = html;
}

function update(){
  if(gameOver) return;

  if(keys["ArrowLeft"]) playerX -= 8;
  if(keys["ArrowRight"]) playerX += 8;

  const minX = 20;
  const maxX = WIDTH() - 20;
  playerX = Math.max(minX, Math.min(maxX, playerX));

  enemyTimer++;
  if(enemyTimer > 450){
    enemies.push(new Enemy(
      Math.random() * (WIDTH()*0.80) + WIDTH()*0.10,
      0,
      generateComposite()
    ));
    enemyTimer = 0;
  }

  bullets.forEach(b=>b.update());
  bullets = bullets.filter(b=>b.y>0);

  enemies.forEach(enemy=>{
    enemy.update();
    if(enemy.y > playerY){
      lives--;
      enemies = enemies.filter(e=>e!==enemy);
      if(lives<=0){
        gameOver = true;
        saveScore(score);
        restartBtn.style.display="block";
      }
    }

    bullets.forEach(bullet=>{
      if(Math.abs(enemy.x-bullet.x)<40 && Math.abs(enemy.y-bullet.y)<40){
        if(enemy.value % bullet.value === 0){
          if(enemy.hit(bullet.value)){
            let gain = Math.floor((HEIGHT()-enemy.y)/10);
            score += gain;
            enemies = enemies.filter(e=>e!==enemy);
            effects.push({text: "+"+gain, x: enemy.x+30, y: enemy.y, color:"lime", end: Date.now()+1500});
          }
        } else {
          score -= 20;
          effects.push({text: "-20", x: enemy.x+30, y: enemy.y, color:"red", end: Date.now()+1500});
        }
        bullets = bullets.filter(b=>b!==bullet);
      }
    });
  });
}

function draw(){
  ctx.clearRect(0,0,WIDTH(),HEIGHT());
  ctx.font="45px Arial";

  if(gameOver){
    ctx.fillStyle="red";
    ctx.fillText("GAME OVER", WIDTH()/2-140, HEIGHT()/2+40);
    ctx.fillStyle="white";
    ctx.fillText("Final Score: "+score, WIDTH()/2-160, HEIGHT()/2+80);
    drawRanking();
    return;
  }

  ctx.fillStyle="green";
  ctx.fillRect(playerX-20, playerY, 40, 20);

  ctx.fillStyle="yellow";
  ctx.fillText(bulletQueue[bulletQueue.length-1], playerX-10, playerY-20);

  bullets.forEach(b=>b.draw());
  enemies.forEach(e=>e.draw());

  effects = effects.filter(eff=> Date.now() < eff.end);
  effects.forEach(eff=>{
    ctx.fillStyle = eff.color;
    ctx.fillText(eff.text, eff.x, eff.y);
  });

  ctx.font = "45px Arial";
  ctx.fillStyle="white";
  ctx.fillText("Score: "+score, 20, 30);
  ctx.fillText("Lives: "+lives, 20, 60);

  drawRanking();
}

function loop(){
  update();
  draw();
  requestAnimationFrame(loop);
}

restartBtn.addEventListener("click", ()=> initGame());

initGame();
loop();
</script>
</body>
</html>
